# Deploys the frontend (Hosting) and the Python Cloud Functions on merge to main.
# Hosting uses the Firebase-provided action; Functions are deployed with the Firebase
# CLI using the same service account.
name: Deploy to Firebase Hosting and Functions on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESYBOT_BD2DB }}
          channelId: live
          projectId: resybot-bd2db

      # --- Functions ---
      # Runtime config (API keys, etc.) comes from GCP Secret Manager, bound to the
      # functions in main.py via set_global_options(secrets=[...]). CI does not handle
      # any of those values; it only needs deploy access.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Firebase CLI runs the functions locally to discover them, so it needs the
      # dependencies installed in functions/venv (the venv it looks for by default).
      - name: Install functions dependencies
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install --upgrade pip
          functions/venv/bin/pip install -r functions/requirements.txt

      - name: Deploy Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESYBOT_BD2DB }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@14 deploy --only functions --project resybot-bd2db --non-interactive
